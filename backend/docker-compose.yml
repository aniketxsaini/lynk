services:
  # Backend Node.js API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lynk_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Ensure port matches container EXPOSE
      - PORT=3000
      # Points to the redis service container within the docker network
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lynk_network

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: lynk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lynk_network

networks:
  lynk_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
